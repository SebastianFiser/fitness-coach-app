name: Android Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout projektu
        uses: actions/checkout@v4

      - name: Nastavení Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Většina moderních Android projektů vyžaduje 17+
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build s Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/debug/*.apk